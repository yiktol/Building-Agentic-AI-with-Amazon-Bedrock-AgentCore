AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Building Agentic AI with Amazon Bedrock AgentCore - Slides Pipeline -
  CloudFront distribution. A private S3 bucket serves the generated static
  Web_Viewer (a single viewer rooted at "/"). CloudFront reaches the bucket
  through an Origin Access Control (OAC); the bucket stays private and only this
  distribution can read it. A viewer-request CloudFront Function redirects "/"
  to the Web_Viewer index and rewrites directory-style URIs to their
  index.html, since a private S3 (REST) origin does not resolve directory
  indexes on its own. The distribution is protected by a WAF Web ACL and
  terminates TLS with an ACM certificate in us-east-1, and a Route53 alias
  points a Project_Prefix subdomain at the distribution. This course has no
  interactive-activity backend, so there is a single S3 origin and no Lambda.

Parameters:
  DomainName:
    Type: String
    Description: Base domain name for the application

  WebApplicationFirewallACLArn:
    Type: String
    Description: ARN of the WAF Web ACL to protect the CloudFront distribution

  CertificateId:
    Type: String
    Description: ACM certificate ID (us-east-1) for SSL/TLS termination at CloudFront

  ProjectPrefix:
    Type: String
    Description: Prefix for all resource names
    Default: agc

  ContentBucketName:
    Type: String
    Description: Name of the private S3 content bucket (from the S3 stack)

  ContentBucketDomainName:
    Type: String
    Description: Regional domain name of the S3 content bucket, used as the CloudFront origin

  JudgeFunctionUrlDomain:
    Type: String
    Description: Host of the AI judge Lambda Function URL (added as a second origin for /judge*)

  AssistantFunctionUrlDomain:
    Type: String
    Description: Host of the course assistant Lambda Function URL (added as a third origin for /assistant*)

  OriginSecret:
    Type: String
    NoEcho: true
    Description: >-
      Secret value sent to both the judge and assistant origins as
      x-origin-secret (verified by each Lambda)

Resources:
  #==================================
  # Origin Access Control (OAC)
  #==================================
  # OAC lets CloudFront sign origin requests with SigV4 so a private S3 bucket
  # can be used as an origin without making the bucket public.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectPrefix}-oac'
        Description: OAC for the agc-slides content bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Separate OAC for the Lambda Function URL origin: CloudFront SigV4-signs the
  # origin request as the "lambda" service so the IAM-auth Function URL accepts
  # it and nobody else can invoke the URL directly.
  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectPrefix}-judge-oac'
        Description: OAC for the agc quiz judge Lambda Function URL
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  #==================================
  # Bucket policy (lives here so it can reference this distribution's ARN)
  #==================================
  # Scoped to this distribution's ARN so only this CloudFront distribution can
  # read the private Content_Bucket.
  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucketName
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${ContentBucketName}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  #==================================
  # Logging Configuration
  #==================================
  CloudFrontLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      # cfn-lint W3045 flags AccessControl as legacy. Kept deliberately: this is
      # the ACL grant CloudFront standard logging relies on, paired with
      # BucketOwnerPreferred below. Removing it on a live logging bucket risks
      # breaking log delivery, so it stays until logging is migrated.
      cfn-lint:
        config:
          ignore_checks:
            - W3045
    Properties:
      AccessControl: LogDeliveryWrite
      BucketName: !Sub '${ProjectPrefix}-logging-${AWS::Region}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-cloudfront-logging-bucket"

  CloudFrontLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogBucket
      PolicyDocument:
        Statement:
          - Action:
              - "s3:*"
            Effect: "Allow"
            Resource: !Join [ "", [ "arn:aws:s3:::", !Ref CloudFrontLogBucket, "/*" ] ]
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  #==================================
  # CloudFront Distribution
  #==================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-demo"
      DistributionConfig:
        Comment: Building Agentic AI with Amazon Bedrock AgentCore Slides Pipeline CloudFront Distribution (S3 origin)
        Aliases:
          - !Sub '${ProjectPrefix}.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Join ['',[!Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/', !Ref CertificateId]]
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Enabled: true
        # No DefaultRootObject: the viewer-request function redirects "/" to
        # "/index.html" and rewrites directory URIs to index.html. This
        # deployment serves a single Web_Viewer at the root.
        HttpVersion: http2and3
        WebACLId: !Ref WebApplicationFirewallACLArn
        Logging:
          Bucket: !Sub ${CloudFrontLogBucket}.s3.amazonaws.com
          IncludeCookies: false
          Prefix: 'cloudfront-logs/'
        Origins:
          # Private S3 content bucket, reached via OAC (SigV4-signed requests).
          - DomainName: !Ref ContentBucketDomainName
            Id: !Sub "${ProjectPrefix}-s3"
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # AI judge Lambda Function URL, reached via Lambda OAC. CloudFront adds
          # a secret origin header the browser never sees; the Lambda verifies it.
          - DomainName: !Ref JudgeFunctionUrlDomain
            Id: !Sub "${ProjectPrefix}-judge"
            OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              HTTPSPort: 443
            OriginCustomHeaders:
              - HeaderName: x-origin-secret
                HeaderValue: !Ref OriginSecret
          # Course assistant Lambda Function URL, reached via the SAME Lambda OAC
          # as the judge. CloudFront adds the same secret origin header the
          # browser never sees; the assistant Lambda verifies it.
          - DomainName: !Ref AssistantFunctionUrlDomain
            Id: !Sub "${ProjectPrefix}-assistant"
            OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              HTTPSPort: 443
            OriginCustomHeaders:
              - HeaderName: x-origin-secret
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          TargetOriginId: !Sub "${ProjectPrefix}-s3"
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouteRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Dynamic quiz-grading endpoint -> judge Lambda. No caching; forward the
          # POST body and all viewer headers to the origin. The viewer-request
          # rewrite function is intentionally NOT associated here so /judge is
          # passed through untouched (not rewritten to /judge/index.html).
          - PathPattern: /judge*
            TargetOriginId: !Sub "${ProjectPrefix}-judge"
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          # KB-grounded course assistant endpoint -> assistant Lambda. Exact
          # parallel to /judge*: no caching, forward the POST body and all
          # viewer headers, and NO viewer-request rewrite function so /assistant
          # passes through untouched (not rewritten to /assistant/index.html).
          - PathPattern: /assistant*
            TargetOriginId: !Sub "${ProjectPrefix}-assistant"
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  # CloudFront Function (viewer-request):
  #   1. "/" or empty  -> 302 redirect to the Web_Viewer index "/index.html".
  #   2. URI ending in "/" -> rewrite to "<uri>index.html".
  #   3. Extensionless last path segment -> rewrite to "<uri>/index.html".
  #   4. Last segment with a "." (a real file) -> pass through unchanged.
  RouteRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectPrefix}-route-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect / to /index.html and rewrite directory URIs to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Site root (or empty): 302 redirect to the Web_Viewer index.
          if (uri === '' || uri === '/') {
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: { 'location': { value: '/index.html' } }
            };
          }

          // Directory URI ending in "/" -> append index.html.
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }

          // Extensionless last path segment -> treat as a directory.
          var lastSegment = uri.split('/').pop();
          if (lastSegment.indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }

          return request;
        }

  CloudfrontRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Sub ${DomainName}.
      Name: !Sub '${ProjectPrefix}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  CloudFrontDistributionId:
    Description: ID of the CloudFront distribution
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId

  CloudFrontDistributionDomainName:
    Description: Domain name of the CloudFront distribution
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDomainName

  CloudFrontDistributionURL:
    Description: URL of the CloudFront distribution
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontURL

  CloudFrontLogBucketName:
    Description: Name of the S3 bucket storing CloudFront access logs
    Value: !Ref CloudFrontLogBucket
    Export:
      Name: !Sub ${AWS::StackName}-LogBucketName
