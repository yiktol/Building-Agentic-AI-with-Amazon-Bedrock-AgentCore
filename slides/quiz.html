<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Check — Building Agentic AI with Amazon Bedrock AgentCore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      /* Palette from the AgentCore course .pptx theme (theme1.xml) */
      --navy: #232F3E; --blue: #007FAA; --green: #1DB893; --teal: #005276;
      --ink: #1a2230; --muted: #64748b; --line: #e6e9ee; --bg: #f5f7fa; --card: #ffffff;
      --ok: #197956; --okbg: #eafaf4; --miss: #b3341f; --missbg: #fdecea; --warn: #b4690e; --warnbg: #fdf4e6;
      --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .topbar { position: sticky; top: 0; z-index: 40; height: 46px; background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
    .topbar .title { font-weight: 600; }
    .topbar .title span { color: var(--green); }
    .topbar .actions { display: flex; gap: 8px; align-items: center; }
    .topbar a, .topbar button { font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; border-radius: 7px; padding: 6px 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.5); background: transparent; color: #fff; }
    .topbar button:hover, .topbar a:hover { background: rgba(255,255,255,0.15); }
    main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .intro { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 12px; padding: 1.1rem 1.3rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
    .intro h1 { margin: 0 0 .3rem; font-size: 1.35rem; color: var(--navy); }
    .intro h1 small { display: block; font-size: .82rem; font-weight: 500; color: var(--muted); margin-top: .25rem; }
    .intro p { margin: .5rem 0 0; font-size: .92rem; line-height: 1.55; color: #40506a; }
    /* progress rail */
    .rail { display: flex; gap: .5rem; margin: 0 0 1.25rem; flex-wrap: wrap; }
    .rail .pill { flex: 1 1 120px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
    .rail .pill .dot { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; background: #eef1f5; color: var(--muted); border: 1px solid var(--line); }
    .rail .pill.correct { border-color: var(--ok); color: var(--ink); }
    .rail .pill.correct .dot { background: var(--ok); color: #fff; border-color: var(--ok); }
    .rail .pill.incorrect { border-color: var(--miss); color: var(--ink); }
    .rail .pill.incorrect .dot { background: var(--miss); color: #fff; border-color: var(--miss); }
    .rail .pill.inprogress { border-color: var(--warn); color: var(--ink); }
    .rail .pill.inprogress .dot { background: var(--warnbg); color: var(--warn); border-color: var(--warn); }
    /* question card */
    .q { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.2rem 1.3rem 1.3rem; margin-bottom: 1.25rem; }
    .q .part { font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); }
    .q .prompt { margin: .25rem 0 .9rem; font-size: 1.02rem; font-weight: 600; color: var(--ink); line-height: 1.45; }
    .opts { display: flex; flex-direction: column; gap: .5rem; }
    .opt { display: flex; align-items: flex-start; gap: .65rem; border: 1px solid var(--line); border-radius: 10px; padding: .65rem .85rem; font-size: .92rem; cursor: pointer; background: #fff; transition: border-color .12s, background .12s; line-height: 1.45; }
    .opt:hover { border-color: #cfd6df; }
    .opt input { accent-color: var(--blue); width: 16px; height: 16px; margin-top: .15rem; flex: none; }
    .opt .letter { font-weight: 700; color: var(--teal); flex: none; }
    .opt.chosen { border-color: var(--blue); background: #f0f8fb; }
    .opt.correct { border-color: var(--ok); background: var(--okbg); }
    .opt.incorrect { border-color: var(--miss); background: var(--missbg); }
    .opt.ruled-out { opacity: .6; }
    .opt.ruled-out .otext { text-decoration: line-through; }
    .opt.locked { cursor: default; }
    .reveal-row { margin-top: 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .btn { font: inherit; font-weight: 600; font-size: .9rem; border: none; border-radius: 9px; padding: .6rem 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; }
    .btn-primary { background: var(--green); color: #06281f; }
    .btn-primary:disabled { background: #d7dde6; color: #96a1b0; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .hint { font-size: .8rem; color: var(--muted); }
    /* AI judge verdict */
    .judge { margin-top: 1rem; border-radius: 10px; border: 1px solid; padding: .8rem 1rem; font-size: .92rem; line-height: 1.55; }
    .judge.correct { background: var(--okbg); border-color: #bfe8d8; color: #12403e; }
    /* "Not quite" is a nudge, not a failure — use an encouraging amber. */
    .judge.incorrect { background: var(--warnbg); border-color: #f4ddb4; color: #6b4310; }
    .judge.incorrect .jbody { color: #6b4310; }
    .judge .jhead { display: flex; align-items: center; gap: .5rem; font-weight: 700; }
    .judge .jhead .jtag { margin-left: auto; font-size: .72rem; font-weight: 700; opacity: .7; text-transform: uppercase; letter-spacing: .03em; background: rgba(255,255,255,.6); border-radius: 999px; padding: .1rem .55rem; }
    .judge .jbody { margin-top: .45rem; color: #40506a; }
    .judge.correct .jbody { color: #1a4a3d; }
    .judge .ans { margin-top: .5rem; font-size: .86rem; }
    .judge .ans b { color: var(--teal); }
    .grading { margin-top: 1rem; display: flex; align-items: center; gap: .6rem; font-size: .88rem; color: var(--teal); }
    .spinner { width: 16px; height: 16px; border: 2px solid #cfe3ec; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* summary */
    .summary { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.2rem 1.3rem; margin-bottom: 1.25rem; display: none; }
    .summary.open { display: block; }
    .summary h2 { margin: 0 0 .4rem; font-size: 1.15rem; color: var(--navy); }
    .summary .score { font-size: 2rem; font-weight: 700; color: var(--teal); }
    .summary .banner { font-size: .9rem; color: #12403e; background: var(--okbg); border: 1px solid #cdeee1; border-radius: 10px; padding: .7rem .9rem; margin-top: .6rem; }
    .loading, .error { padding: 2.5rem; text-align: center; color: var(--muted); }
    .error { color: var(--miss); }
    footer { max-width: 820px; margin: 0 auto; padding: 0 1.25rem 2.5rem; font-size: .8rem; color: var(--muted); line-height: 1.6; }
    footer code { background: #eef1f5; border: 1px solid var(--line); border-radius: 4px; padding: .05rem .3rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title" id="topTitle">Knowledge Check</div>
    <div class="actions">
      <button id="resetBtn" type="button" title="Clear your answers">Reset</button>
      <a href="index.html">All modules</a>
    </div>
  </div>
  <main id="main"><div class="loading">Loading knowledge check&hellip;</div></main>
  <footer id="footer"></footer>

  <script>
    const MODULE = (() => { const m = new URL(location.href).searchParams.get("m"); return m && /^[1-6]$/.test(m) ? m : "1"; })();
    const STORE_KEY = "agc-quiz:m" + MODULE;
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const LETTERS = ["A", "B", "C", "D", "E", "F"];

    // ---- AI judge (same-origin /judge, OAC -> Lambda) --------------------
    // The learner's pick is sent to an AI judge (Amazon Bedrock behind
    // CloudFront) which explains why that choice is right or wrong. Override
    // the endpoint with ?judge=<url>; disable with ?judge=off (falls back to the
    // local expert rationale). Any failure falls back silently.
    const JUDGE_URL = (() => {
      const q = new URL(location.href).searchParams.get("judge");
      if (q === "off" || q === "none") return "";
      if (q) return q;
      try { const ls = localStorage.getItem("agc-judge-url"); if (ls !== null) return ls; } catch (e) {}
      return "/judge";
    })();
    const JUDGE_ENABLED = !!JUDGE_URL;
    const JUDGE_TIMEOUT_MS = 25000;

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // Call the judge in "quiz" mode. Returns {explanation,...} on success, else null.
    async function judgeQuiz(payload) {
      if (!JUDGE_ENABLED) return null;
      const body = JSON.stringify(payload);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), JUDGE_TIMEOUT_MS);
      try {
        const hash = await sha256Hex(body);
        const res = await fetch(JUDGE_URL, {
          method: "POST",
          headers: { "content-type": "application/json", "x-amz-content-sha256": hash },
          body, signal: ctrl.signal,
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data && data.explanation ? data : null;
      } catch (e) { return null; }
      finally { clearTimeout(timer); }
    }

    // ---- persistence (localStorage; browser-only) ----
    function loadState() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
    function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
    let state = loadState(); // { "<qid>": { pick, submitted, correct, explanation } }
    function qstate(id) { return state[id] || (state[id] = {}); }

    // ---- data load: JS bundle first (file://), then fetch (HTTP) ----
    function loadData() {
      return new Promise((resolve) => {
        if (window.QUIZ_DATA && window.QUIZ_DATA[MODULE]) { resolve(window.QUIZ_DATA[MODULE]); return; }
        const el = document.createElement("script");
        el.src = `quiz/m${MODULE}.js`;
        el.onload = () => resolve((window.QUIZ_DATA && window.QUIZ_DATA[MODULE]) || null);
        el.onerror = async () => {
          try { const r = await fetch(`quiz/m${MODULE}.json`, { cache: "no-cache" }); resolve(r.ok ? await r.json() : null); }
          catch (e) { resolve(null); }
        };
        document.head.appendChild(el);
      });
    }

    let DATA = null;

    function render() {
      const main = document.getElementById("main");
      document.getElementById("topTitle").innerHTML = `Module ${DATA.module} <span>&middot; ${esc(DATA.subtitle || "Knowledge Check")}</span>`;
      document.getElementById("footer").innerHTML =
        `Wrong answers are not revealed — you get a hint and keep trying until you find the right one. ` +
        `Your progress is saved in this browser only (localStorage). ` +
        (JUDGE_ENABLED
          ? `When you submit, your pick is sent to an AI judge (Amazon Bedrock) which coaches you without giving the answer away — nothing is stored server-side. Add <code>?judge=off</code> to use the built-in hints instead.`
          : `Hints are generated locally; nothing is sent anywhere.`);

      let html = `<section class="intro">
        <h1>${esc(DATA.title)}<small>${esc(DATA.subtitle || "Knowledge Check")}</small></h1>
        <p>${esc(DATA.intro)}</p>
      </section>`;

      // progress rail — a question turns green only once solved; otherwise it
      // shows the attempt count in progress (no wrong/correct reveal).
      html += `<div class="rail" id="rail">` + DATA.questions.map((q, i) => {
        const st = qstate(q.id);
        const cls = st.solved ? "correct" : (st.attempts ? "inprogress" : "");
        const mark = st.solved ? "&#10003;" : (i + 1);
        return `<div class="pill ${cls}" data-rail="${i}"><span class="dot">${mark}</span><span>Question ${i + 1}</span></div>`;
      }).join("") + `</div>`;

      html += DATA.questions.map((q, i) => renderQuestion(q, i)).join("");
      html += `<section class="summary" id="summary"></section>`;
      main.innerHTML = html;
      wire();
      renderSummary();
    }

    function renderQuestion(q, i) {
      const st = qstate(q.id);
      const solved = !!st.solved;
      const opts = q.options.map((o, idx) => {
        const chosen = st.pick === idx ? "chosen" : "";
        let verdictCls = "";
        const tried = Array.isArray(st.wrong) && st.wrong.includes(idx);
        if (solved) {
          // Once solved, highlight only the correct option (which the learner picked).
          if (idx === q.answerIndex) verdictCls = "correct";
        } else if (tried) {
          // Options already tried and ruled out stay marked wrong; never the answer.
          verdictCls = "incorrect ruled-out";
        }
        const lock = solved ? "locked" : "";
        return `<label class="opt ${chosen} ${verdictCls} ${lock}" data-opt="${q.id}:${idx}">
          <input type="radio" name="${q.id}" value="${idx}" ${st.pick === idx ? "checked" : ""} ${solved || tried ? "disabled" : ""} />
          <span class="letter">${LETTERS[i2(idx)]}.</span>
          <span class="otext">${esc(o)}</span>
        </label>`;
      }).join("");

      const judge = (solved || st.lastWrong) ? renderJudge(q, st) : "";
      let btn;
      if (solved) {
        btn = `<span class="hint"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i> Solved${st.attempts > 1 ? ` in ${st.attempts} attempts` : ""}.</span>`;
      } else {
        const label = st.lastWrong ? "Try again" : "Submit answer";
        const icon = st.lastWrong ? "fa-rotate-left" : "fa-check";
        btn = `<button class="btn btn-primary" type="button" data-submit="${q.id}" ${st.pick == null ? "disabled" : ""}><i class="fa-solid ${icon}"></i> ${label}</button>`;
      }
      const hint = solved || st.lastWrong ? "" : `<span class="hint">Pick an option, then submit.</span>`;

      return `<section class="q" id="q-${q.id}">
        <div class="part">Question ${i + 1} of ${DATA.questions.length}</div>
        <div class="prompt">${esc(q.prompt)}</div>
        <div class="opts" data-opts="${q.id}">${opts}</div>
        <div class="reveal-row" id="row-${q.id}">${btn}${hint}</div>
        <div id="judge-${q.id}">${judge}</div>
      </section>`;
    }
    // identity helper (keeps letter index == option index)
    function i2(idx) { return idx; }

    function renderJudge(q, st) {
      // Correct: affirm and explain. Wrong: nudge only — never reveal the answer.
      const solved = !!st.solved;
      const cls = solved ? "correct" : "incorrect";
      const head = solved ? "Correct" : "Not quite — try again";
      const icon = solved ? "fa-circle-check" : "fa-lightbulb";
      const tag = st.judged ? "AI assistant" : "Hint";
      const explanation = st.explanation || "";
      const nudge = solved ? "" : `<div class="ans">Rule that option out and pick another — keep going until you find the right one.</div>`;
      return `<div class="judge ${cls}">
        <div class="jhead"><i class="fa-solid ${icon}"></i> ${head}<span class="jtag">${esc(tag)}</span></div>
        <div class="jbody">${esc(explanation)}</div>
        ${nudge}
      </div>`;
    }

    function wire() {
      // option selection
      document.querySelectorAll('.opts input[type="radio"]').forEach((inp) => {
        inp.addEventListener("change", (e) => {
          const [qid, idxStr] = e.target.closest(".opt").dataset.opt.split(":");
          const st = qstate(qid);
          if (st.submitted) return;
          st.pick = parseInt(idxStr, 10);
          saveState(state);
          // reflect selection + enable submit
          const sec = document.getElementById("q-" + qid);
          sec.querySelectorAll(".opt").forEach((o) => o.classList.remove("chosen"));
          e.target.closest(".opt").classList.add("chosen");
          const btn = sec.querySelector("[data-submit]");
          if (btn) btn.disabled = false;
        });
      });
      // submit (and re-submit after a wrong attempt)
      document.querySelectorAll("[data-submit]").forEach((b) => b.addEventListener("click", () => submitAnswer(b.dataset.submit)));
      // rail jump
      document.querySelectorAll("[data-rail]").forEach((p) => p.addEventListener("click", () => {
        const i = parseInt(p.dataset.rail, 10); const q = DATA.questions[i];
        document.getElementById("q-" + q.id).scrollIntoView({ block: "center", behavior: "smooth" });
      }));
      // reset
      document.getElementById("resetBtn").onclick = () => { if (confirm("Clear your answers for this knowledge check?")) { state = {}; saveState(state); render(); } };
    }

    async function submitAnswer(qid) {
      const q = DATA.questions.find((x) => x.id === qid);
      const st = qstate(qid);
      if (st.pick == null || st.solved) return;
      const pick = st.pick;
      const correct = pick === q.answerIndex;
      st.attempts = (st.attempts || 0) + 1;
      // show grading spinner while the judge responds
      const row = document.getElementById("row-" + qid);
      if (row) row.innerHTML = `<span class="grading"><span class="spinner"></span> Asking the AI assistant about your answer&hellip;</span>`;

      // Ask the judge. For a wrong pick it must NOT reveal the correct option.
      let explanation = "", judged = false;
      const verdict = await judgeQuiz({
        mode: "choice",
        prompt: q.prompt,
        options: q.options.map((o, i) => `${LETTERS[i]}. ${o}`),
        pick: `${LETTERS[pick]}. ${q.options[pick]}`,
        correct: correct,
        attempt: st.attempts,
        tried: (st.wrong || []).map((w) => `${LETTERS[w]}. ${q.options[w]}`),
        answer: `${LETTERS[q.answerIndex]}. ${q.answer}`,
        why: q.why,
      });
      if (verdict && verdict.explanation) { explanation = verdict.explanation; judged = true; }
      else { explanation = localExplanation(q, correct, pick); judged = false; }

      if (correct) {
        Object.assign(st, { solved: true, explanation, judged, lastWrong: false });
      } else {
        // Record the ruled-out option, nudge, and keep the question open.
        st.wrong = Array.isArray(st.wrong) ? st.wrong : [];
        if (!st.wrong.includes(pick)) st.wrong.push(pick);
        st.lastWrong = true;
        st.explanation = explanation;
        st.judged = judged;
        st.pick = null; // force a fresh choice for the retry
      }
      saveState(state);
      render();
      document.getElementById("q-" + qid).scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    // Fallback explanation (no judge). Never reveals the correct option on a
    // wrong pick — gives a Socratic nudge drawn from the expert rationale and
    // asks the learner to try another option.
    function localExplanation(q, correct, pickIdx) {
      const why = (q.why || "").trim();
      if (correct) {
        return why || "That's the correct answer — well reasoned.";
      }
      // Pull the sentence of the rationale that discusses the chosen option, so
      // the hint is specific without naming the right answer.
      const letter = LETTERS[typeof pickIdx === "number" ? pickIdx : 0];
      let nudge = "";
      if (why) {
        const sentences = why.split(/(?<=[.!?])\s+/);
        const hit = sentences.find((s) => new RegExp("option\\s+" + letter + "\\b", "i").test(s));
        if (hit) nudge = hit.trim();
      }
      return nudge || "That option isn't the best fit for what the question is really asking. Reconsider the key requirement and try another.";
    }

    function renderSummary() {
      const sumEl = document.getElementById("summary");
      const total = DATA.questions.length;
      const solved = DATA.questions.filter((q) => qstate(q.id).solved).length;
      if (solved < total) { sumEl.classList.remove("open"); return; }
      // Every question has been solved. Report how many were nailed first try.
      const firstTry = DATA.questions.filter((q) => (qstate(q.id).attempts || 0) === 1).length;
      const totalAttempts = DATA.questions.reduce((s, q) => s + (qstate(q.id).attempts || 0), 0);
      sumEl.classList.add("open");
      sumEl.innerHTML = `
        <h2>Knowledge check complete</h2>
        <div class="score">${solved} / ${total} solved</div>
        <div class="banner">${firstTry === total
          ? "Every question on the first try — you've got the core concepts of this module down."
          : `You solved all ${total} question${total === 1 ? "" : "s"} in ${totalAttempts} attempts (${firstTry} on the first try). Nicely done sticking with it.`}</div>
        <div class="reveal-row">
          <a class="btn btn-ghost" href="deck.html?m=${DATA.module}"><i class="fa-solid fa-play"></i> Back to the slides</a>
          <a class="btn btn-ghost" href="index.html"><i class="fa-solid fa-layer-group"></i> All modules</a>
        </div>`;
    }

    (async function init() {
      DATA = await loadData();
      if (!DATA) {
        document.getElementById("main").innerHTML = `<div class="error">Could not load the knowledge check for module ${esc(MODULE)}.<br>Expected <code>quiz/m${esc(MODULE)}.js</code> (or <code>.json</code> over HTTP).</div>`;
        return;
      }
      render();
    })();
  </script>
</body>
</html>
